[workspace]
authors = ["Alex <alixjcob559@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "tdims"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
example = "python examples/example_basic.py"
example-mojo = "mojo run -I src/mojo examples/example_basic.mojo"
test = "python tests/test_parity.py"

[dependencies]
mojo = ">=1.1.0,<2"
python = ">=3.14.7,<3.15"
numpy = ">=2.5.3,<3"
rdkit = ">=2026.9.1,<2027"
scikit-learn = ">=1.9.1,<2"
pandas = ">=3.0.6,<4"
scipy = ">=1.18.1,<2"
